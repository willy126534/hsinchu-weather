<h1>Motivational Quote</h1>
<div id="quote">Loading...</div>
<script>
    async function loadQuote(){
        const res=await fetch('https://api.quotable.io/random?tags=motivational');
        const q=await res.json();
        document.getElementById('quote').innerHTML=`<p>&ldquo;${q.content}&rdquo;</p><p style="text-align:right;">— ${q.author}</p>`;
    }
    loadQuote();
</script>
