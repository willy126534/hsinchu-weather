<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke</title>
    <style>
        body{font-family:system-ui,Arial,sans-serif;background:#333;color:#f0f0f0;margin:0;padding:1rem;display:flex;flex-direction:column;align-items:center;}
        nav a{color:#fff;margin:0 .5rem;}
        #joke{margin-top:2rem;padding:1rem;background:#444;border-radius:6px;width:100%;max-width:600px;}
        button{margin-top:1rem;padding:.5rem 1rem;background:#4da6ff;color:#000;font-weight:bold;border:none;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Weather</a>
        <a href="news.html">News</a>
        <a href="reddit.html">Reddit</a>
        <a href="jokes.html">Jokes</a>
        <a href="quote.html">Quote</a>
        <a href="todo.html">Todo</a>
    </nav>
    <h1>Random Joke</h1>
    <div id="joke">Loading...</div>
    <button id="next">Next Joke</button>
    <script>
        async function fetchJoke(){
            const r = await fetch('https://v2.jokeapi.dev/joke/Programming?type=single');
            const j = await r.json();
            document.getElementById('joke').textContent = j.joke;
        }
        document.getElementById('next').addEventListener('click', fetchJoke);
        fetchJoke();
    </script>
</body>
</html>
