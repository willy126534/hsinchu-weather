<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Viewer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .weather-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            margin-top: 1rem;
        }
        input, button { padding: .5rem; font-size: 1rem; }
        #map { margin-top: 1rem; width: 100%; height: 300px; }
    </style>
</head>
<body>
    <h1>Weather Viewer</h1>
    <form id="searchForm">
        <input type="text" id="locationInput" placeholder="Enter location" required />
        <button type="submit">Get Weather</button>
    </form>
    <div class="weather-card" id="weatherCard" style="display:none;">
        <div id="locationName"></div>
        <div id="temperature"></div>
        <div id="condition"></div>
        <div id="wind"></div>
    </div>
    <div id="map"></div>
    <script>
        // Fallback geocoding: try open-meteo; if fails, use Nominatim (OpenStreetMap)
        async function getCoordinates(name) {
            const omData = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1`);
            const omJson = await omData.json();
            if (omJson.results && omJson.results.length) {
                const {latitude, longitude, name: placeName, country} = omJson.results[0];
                return {latitude, longitude, placeName, country};
            }
            // Fallback to Nominatim
            const nomData = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(name)}&format=json&limit=1`); 
            const nomJson = await nomData.json();
            if (nomJson && nomJson.length) {
                const {lat, lon, display_name} = nomJson[0];
                // Try to split display name into components
                const parts = display_name.split(',');
                const placeName = parts[0];
                const country = parts[parts.length - 1];
                return {latitude: parseFloat(lat), longitude: parseFloat(lon), placeName, country};
            }
            throw new Error('Location not found');
        }
        async function getWeather(lat, lon) {
            const resp = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&timezone=auto`);
            const data = await resp.json();
            return data.current;
        }
        function weatherCodeToText(code){
            const mapping = {
                0:"Clear sky",
                1:"Mainly clear",
                2:"Partly cloudy",
                3:"Overcast",
                45:"Fog",
                48:"Depositing rime fog",
                51:"Light drizzle",
                53:"Moderate drizzle",
                55:"Dense drizzle",
                61:"Slight rain",
                63:"Moderate rain",
                65:"Heavy rain",
                71:"Slight snow fall",
                73:"Moderate snow fall",
                75:"Heavy snow fall",
                80:"Slight rain showers",
                81:"Moderate rain showers",
                82:"Violent rain showers",
                95:"Thunderstorm",
                96:"Thunderstorm with slight hail",
                99:"Thunderstorm with heavy hail"
            };
            return mapping[code] || "Unknown";
        }
        document.getElementById('searchForm').addEventListener('submit', async e=>{
            e.preventDefault();
            const loc = document.getElementById('locationInput').value.trim();
            if(!loc) return;
            try {
                const {latitude, longitude, placeName, country} = await getCoordinates(loc);
                const weather = await getWeather(latitude, longitude);
                document.getElementById('locationName').textContent = `${placeName}, ${country}`;
                document.getElementById('temperature').textContent = `${weather.temperature_2m}°C`;
                document.getElementById('condition').textContent = weatherCodeToText(weather.weather_code);
                document.getElementById('wind').textContent = `Wind ${weather.wind_speed_10m} km/h`;
                document.getElementById('weatherCard').style.display='block';
                // Google Maps embed without API key using generic URL
                const mapDiv = document.getElementById('map');
                mapDiv.innerHTML = `<iframe width="100%" height="100%" style="border:0" loading="lazy" allowfullscreen src="https://www.google.com/maps?q=${latitude},${longitude}&z=12&output=embed"></iframe>`;
            } catch(err){
                alert(err.message);
            }
        });
    </script>
</body>
</html>
