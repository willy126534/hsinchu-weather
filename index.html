<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today's Weather - Hsinchu, Taiwan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        .location {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .date {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        .temperature {
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .unit {
            font-size: 2rem;
            opacity: 0.8;
        }
        .weather-condition {
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        .detail-item {
            text-align: center;
        }
        .detail-label {
            font-size: 0.9rem;
            opacity: 0.7;
        }
        .detail-value {
            font-size: 1.2rem;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <div class="location">Hsinchu, Taiwan</div>
        <div class="date">Thu, May 15, 2025</div>
        
        <div class="temperature">21.4°C</div>
        <div class="weather-condition">Clear Sky</div>
        
        <div class="details">
            <div class="detail-item">
                <div class="detail-label">Wind Speed</div>
                <div class="detail-value">11.8 km/h</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Weather Code</div>
                <div class="detail-value">3 (Clear)</div>
            </div>
        </div>
    </div>
</body>
</html>
